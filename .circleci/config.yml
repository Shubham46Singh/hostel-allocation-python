version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16.4-alpine
        environment:
          POSTGRES_DB: hostel
          POSTGRES_USER: hostel
          POSTGRES_PASSWORD: hostel_dev_password
      - image: redis:7.4.0-alpine

    environment:
      DATABASE_URL: postgresql://hostel:hostel_dev_password@localhost:5432/hostel
      REDIS_URL: redis://localhost:6379/0

    steps:
      - checkout

      - run:
          name: Install application and test dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest pytest-cov ruff httpx

      - run:
          name: Check code quality
          command: python -m ruff check .

      - run:
          name: Run allocation unit tests
          command: python -m pytest tests/test_allocate.py tests/test_allocation_flow.py -v

      - run:
          name: Wait for PostgreSQL and Redis
          command: python .circleci/wait_for_services.py

      - run:
          name: Apply database migrations and seed data
          command: python .circleci/migrate.py

      - run:
          name: Start API and run all tests with coverage
          command: |
            set -eu
            python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 > /tmp/hostel-api.log 2>&1 &
            API_PID=$!

            cleanup() {
              kill "$API_PID" 2>/dev/null || true
            }
            trap cleanup EXIT

            for attempt in $(seq 1 30); do
              if python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)" 2>/dev/null; then
                echo "FastAPI is ready."
                set +e
                python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -v
                TEST_STATUS=$?
                set -e

                if [ "$TEST_STATUS" -ne 0 ]; then
                  echo "API server logs:"
                  cat /tmp/hostel-api.log
                fi

                exit "$TEST_STATUS"
              fi

              sleep 2
            done

            echo "FastAPI failed to start."
            cat /tmp/hostel-api.log
            exit 1

      - run:
          name: Scan repository for secrets
          command: |
            set -eu
            GITLEAKS_VERSION="8.24.2"
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tar.gz
            mkdir -p /tmp/gitleaks-bin
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
            /tmp/gitleaks-bin/gitleaks detect \
              --source . \
              --no-git \
              --redact \
              --exit-code 1 \
              --gitleaks-ignore-path .

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            docker build -t "hostel-allocation:${CIRCLE_SHA1}" .

      - run:
          name: Log in to Docker Hub
          command: |
            set -eu

            if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "ERROR: DOCKERHUB_TOKEN is missing in CircleCI environment variables."
              exit 1
            fi

            printf '%s' "$DOCKERHUB_TOKEN" | docker login \
              --username "vedanth02" \
              --password-stdin

      - run:
          name: Tag Docker image
          command: |
            set -eu

            IMAGE="vedanth02/hostel-allocation-python"

            docker tag "hostel-allocation:${CIRCLE_SHA1}" "${IMAGE}:${CIRCLE_SHA1}"
            docker tag "hostel-allocation:${CIRCLE_SHA1}" "${IMAGE}:latest"
            docker tag "hostel-allocation:${CIRCLE_SHA1}" "${IMAGE}:1.0"

      - run:
          name: Push Docker images to Docker Hub
          command: |
            set -eu

            IMAGE="vedanth02/hostel-allocation-python"

            docker push "${IMAGE}:${CIRCLE_SHA1}"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:1.0"

workflows:
  test:
    jobs:
      - build-and-test