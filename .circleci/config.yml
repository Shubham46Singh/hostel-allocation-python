
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16.4-alpine
        environment:
          POSTGRES_DB: hostel
          POSTGRES_USER: hostel
          POSTGRES_PASSWORD: hostel_dev_password
      - image: redis:7.4.0-alpine

    environment:
      DATABASE_URL: postgresql://hostel:hostel_dev_password@localhost:5432/hostel
      REDIS_URL: redis://localhost:6379/0

    steps:
      - checkout

      - run:
          name: Install application and test dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest pytest-cov ruff httpx

      - run:
          name: Check code quality
          command: python -m ruff check .

      - run:
          name: Run allocation unit tests
          command: python -m pytest tests/test_allocate.py tests/test_allocation_flow.py -v

      - run:
          name: Wait for PostgreSQL and Redis
          command: python .circleci/wait_for_services.py

      - run:
          name: Apply database migrations and seed data
          command: python .circleci/migrate.py

      - run:
          name: Start FastAPI application
          command: |
            python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
              > /tmp/hostel-api.log 2>&1 &
            for attempt in $(seq 1 30); do
              if python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)" 2>/dev/null; then
                echo "FastAPI is ready."
                exit 0
              fi
              sleep 2
            done
            cat /tmp/hostel-api.log
            echo "FastAPI failed to start."
            exit 1

      - run:
          name: Run all tests
          command: python -m pytest -v

workflows:
  test:
    jobs:
      - build-and-test
