
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: hostel
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.0-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16.4-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hostel:hostel_dev_password@db:5432/hostel
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for file in /migrations/*.sql; do
          echo "Applying $$file"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$file"
        done

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hostel:hostel_dev_password@db:5432/hostel
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
