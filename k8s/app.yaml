apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-allocation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostel-allocation
  template:
    metadata:
      labels:
        app: hostel-allocation
    spec:
      containers:
        - name: app
          image: vedanth02/hostel-allocation-python:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://hostel:hostel_dev_password@db:5432/hostel
            - name: REDIS_URL
              value: redis://redis:6379/0
          startupProbe:
            httpGet:
              path: /docs
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hostel-allocation
spec:
  type: ClusterIP
  selector:
    app: hostel-allocation
  ports:
    - port: 8080
      targetPort: 8080
